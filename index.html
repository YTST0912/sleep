<script>
"use strict";

var PAY_URL = "";

var TYPES = {
  instant: {
    name: "秒睡型", rare: "被所有人羡慕的那种",
    one: "沾到枕头就着，别人数羊数到三百的时候，你已经做完一个梦了。",

    one: "工作日睡五六个小时，周末睡到下午，然后把作息彻底搞乱。",
    feat: ["周一到周五靠意志力撑着", "周六睡到下午两点，起来天都黑了", "周日晚上睡不着，周一早上起不来"],
    do: "周末最多比平时多睡两小时。补太多，你的生物钟会更乱。",
    avoid: "别指望周末补回来。睡眠债补不回来，只能少欠一点。"
  }
};

var QS = [
  { q: "躺下之后，你一般多久能睡着？",
    o: [["五分钟以内，沾枕头就着", {instant:3}], ["半小时以上，脑子停不下来", {rehearsal:3}], ["看手机看到困为止", {phone:3}], ["不知道，反正经常天亮了还在躺", {early:3}]] },

  { q: "睡前你最后做的一件事是？",
    o: [["刷手机，说好五分钟", {phone:3}], ["开个播客或者白噪音", {sound:3}], ["躺着想明天要做什么", {rehearsal:3}], ["设好闹钟，然后倒头就睡", {snooze:3}]] },

  { q: "早上闹钟响的时候，你？",
    o: [["经常在闹钟响之前就醒了", {early:3}], ["按掉，再睡五分钟，再按掉", {snooze:3}], ["周末直接睡到下午", {weekend:3}], ["一响就起来，没什么挣扎", {instant:3}]] },

  { q: "你一般怎么睡？",
    o: [["侧躺，抱着东西", {light:3}], ["开着风扇或者电视才能睡", {sound:3}], ["几点睡全看第二天要不要早起", {weekend:3}], ["随便什么姿势，闭眼就着", {instant:3}]] },

  { q: "半夜醒了，你会？",
    o: [["翻个身继续睡，很快", {light:3}], ["看一眼手机，然后就睡不着了", {phone:3}], ["开始想事情，越想越清醒", {rehearsal:3}], ["几乎不会半夜醒", {instant:3}]] },

  { q: "周末你一般几点起？",
    o: [["跟平时差不多，睡不了懒觉", {early:3}], ["睡到中午，甚至下午", {weekend:3}], ["闹钟响了十遍才起", {snooze:3}], ["醒了但不起来，躺着刷手机", {phone:3}]] },

  { q: "你的睡眠环境必须是？",
    o: [["有点声音，绝对安静我睡不着", {sound:3}], ["必须全黑、必须安静", {light:3}], ["无所谓，什么环境都能睡", {instant:3}], ["必须是自己的床，换地方睡不着", {snooze:3}]] },

  { q: "你做梦多吗？",
    o: [["经常做，而且记得很清楚", {rehearsal:3}], ["偶尔，都是些乱七八糟的", {light:3}], ["很少，睡过去就什么都不知道", {instant:3}], ["一累就做梦，不累就不做", {weekend:3}]] },

  { q: "有人在你旁边睡，你会？",
    o: [["睡不着，动一下我就醒", {light:3}], ["得等他先睡着我才行", {sound:3}], ["没影响，我照样秒睡", {instant:3}], ["得背对着，各睡各的", {phone:3}]] },

  { q: "早上醒来第一件事是？",
    o: [["摸手机看时间，然后开始刷", {phone:3}], ["看时间，发现比闹钟早", {early:3}], ["再睡五分钟", {snooze:3}], ["想今天能不能不上班", {weekend:3}]] },

  { q: "你一般睡几个小时？",
    o: [["工作日五六个，周末十个小时", {weekend:3}], ["固定七小时，很规律", {early:3}], ["睡够八小时也还是累", {light:3}], ["看情况，有时候四小时也精神", {rehearsal:3}]] },

  { q: "别人说你睡觉的时候？",
    o: [["「你怎么做到的，一沾枕头就没声了」", {instant:3}], ["「你半夜还在刷手机吧」", {phone:3}], ["「叫都叫不醒」", {snooze:3}], ["「你睡觉是不是开了一晚上电视」", {sound:3}]] }
];

var answers = new Array(QS.length).fill(-1);
var curIdx = 0;

(function(){
  try{
    var n = parseInt(localStorage.getItem("sleep_cnt") || "0", 10) + 1;
    localStorage.setItem("sleep_cnt", n);
    document.getElementById("cnt").textContent = "已测试人数：" + (1042 + n);
  }catch(e){}
})();

document.getElementById("start").addEventListener("click", function(){
  var cv = document.getElementById("cover");
  cv.style.transition = "opacity .22s";
  cv.style.opacity = "0";
  setTimeout(function(){
    cv.classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");
    document.getElementById("total").textContent = QS.length;
    curIdx = 0;
    renderQ();
  }, 190);
});

function moonSVG(size){
  return '<div class="moonbar">' +
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 72 72" fill="none">' +
      '<circle cx="26" cy="4" r="1.4" fill="#FFF" style="animation:twinkle 2.6s infinite"/>' +
      '<circle cx="48" cy="2" r="1.1" fill="#F5C518" style="animation:twinkle 3.4s .6s infinite"/>' +
      '<circle cx="60" cy="6" r="1.2" fill="#FFF" style="animation:twinkle 2.2s .4s infinite"/>' +
      '<g style="transform-origin:36px 38px;animation:floatMoon 5s ease-in-out infinite">' +
        '<path fill="#F5C518" d="M 58.75,45.66 A 24,24 0 1,1 34.21,14.07 A 20,20 0 1,0 58.75,45.66 Z"/>' +
      '</g>' +
    '</svg></div>';
}

function renderQ(){
  var q = QS[curIdx];
  document.getElementById("cur").textContent = curIdx + 1;
  document.getElementById("pbar").style.width = (curIdx / QS.length * 100) + "%";

  var h = moonSVG(104);
  h += '<div class="qtext">' + q.q + '</div><div class="opts">';
  q.o.forEach(function(o, i){
    h += '<button class="opt" data-i="' + i + '">' + o[0] + '</button>';
  });
  h += '</div>';

  var w = document.getElementById("qwrap");
  w.className = "qwrap";
  w.innerHTML = h;
  void w.offsetWidth;
  w.classList.add("enter");


  w.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.dataset.lock) return;
      w.querySelectorAll(".opt").forEach(function(x){ x.dataset.lock = "1"; });
      b.classList.add("sel");
      answers[curIdx] = +b.dataset.i;
      setTimeout(function(){
        w.classList.remove("enter");
        w.classList.add("exit");
        setTimeout(function(){
          curIdx++;
          if (curIdx >= QS.length) showResult();
          else renderQ();
        }, 180);
      }, 260);
    });
  });
}

function calc(){
  var score = {};
  Object.keys(TYPES).forEach(function(k){ score[k] = 0; });
  answers.forEach(function(oi, qi){
    if (oi < 0) return;
    var m = QS[qi].o[oi][1];
    Object.keys(m).forEach(function(k){ score[k] += m[k]; });
  });
  var best = null, bv = -1;
  Object.keys(score).forEach(function(k){ if (score[k] > bv){ bv = score[k]; best = k; } });
  var sec = null, sv = -1;
  Object.keys(score).forEach(function(k){ if (k !== best && score[k] > sv){ sv = score[k]; sec = k; } });
  return { main: best, second: sec, score: score };
}

function showResult(){
  var r = calc(), t = TYPES[r.main], s = TYPES[r.second];
  var FULL = /[?&]full=1/.test(location.search);

  document.getElementById("quiz").classList.add("hidden");

  var h = '<div class="rTop">';
  h += '<div class="rKick">你的睡眠人格</div>';
  h += '<div class="rName">' + t.name + '</div>';
  h += '<p class="rOne">' + t.one + '</p>';
  h += '</div>';

  h += '<button class="shareBar" id="share">发给我朋友，让他们也测 →</button>';
  h += '<ul class="feat"><li>' + t.feat[0] + '</li>';
  if (FULL) h += '<li>' + t.feat[1] + '</li><li>' + t.feat[2] + '</li>';
  h += '</ul>';

  if (FULL){
    h += '<div class="sec"><h4>适合做什么</h4><p>' + t.do + '</p></div>';
    h += '<div class="sec"><h4>要避开的坑</h4><p>' + t.avoid + '</p></div>';
    h += '<div class="sec"><h4>你的第二型 · ' + s.name + '</h4><p>你大部分时候是「' +
         t.name + '」，但在某些状态下会切到「' + s.name + '」。</p></div>';
  } else {
    h += '<div class="lock"><b>还有 2 条特征没给你看</b>';
    h += '<p>以及：你该注意什么、你的第二型是什么</p>';
    if (PAY_URL) h += '<a class="unlockBtn" href="' + PAY_URL + '" target="_blank" rel="noopener">看完整结果 · ¥9.9</a>';
    else h += '<p style="margin:0">完整版暂未开放</p>';
    h += '</div>';
  }

  h += '<div class="subs"><button class="ghost" id="save">保存结果图</button>' +
       '<button class="ghost" id="again">重新测一次</button></div>';
  h += '<footer>困了就睡，别硬撑。</footer>';

  var box = document.getElementById("result");
  box.innerHTML = h;
  box.classList.remove("hidden");
  window.scrollTo({top:0});

  document.getElementById("share").addEventListener("click", function(){
    var base = location.origin + location.pathname;
    if (location.protocol === "file:") base = location.href.split("?")[0];
    var link = base + "?r=" + r.main;
    var txt = "我测出来是「" + TYPES[r.main].name + "」——" + TYPES[r.main].rare + "。\n" +
              "你也测测，看是不是同一型：\n" + link + "\n测完把你的结果发我";
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        alert("已复制，去微信粘贴给朋友：\n\n" + txt);
      }).catch(function(){ prompt("复制这段发给朋友：", txt); });
    } else prompt("复制这段发给朋友：", txt);
  });

  document.getElementById("save").addEventListener("click", function(){
    var a = document.createElement("a");
    a.href = drawCard(r); a.download = "我的睡眠人格.png"; a.click();
  });

  document.getElementById("again").addEventListener("click", function(){
    answers = new Array(QS.length).fill(-1);
    curIdx = 0;
    var box2 = document.getElementById("result");
    box2.classList.add("hidden"); box2.innerHTML = "";
    var cv = document.getElementById("cover");
    cv.classList.remove("hidden");
    cv.style.opacity = "1";
    window.scrollTo({top:0});
  });
}

function wrapText(g, text, x, y, maxW, lh){
  var line = "";
  for (var i = 0; i < text.length; i++){
    var t = line + text[i];
    if (g.measureText(t).width > maxW && line){ g.fillText(line, x, y); line = text[i]; y += lh; }
    else line = t;
  }
  if (line) g.fillText(line, x, y);
  return y + lh;
}

function drawCard(r){
  var t = TYPES[r.main];
  var cv = document.getElementById("cv");
  var W = 1080, H = 1560;
  cv.width = W; cv.height = H;
  var g = cv.getContext("2d");
  var F = "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif";

  g.fillStyle = "#0B0D12"; g.fillRect(0, 0, W, H);

  // 星星
  var stars = [[80,120],[220,90],[380,150],[560,80],[700,140],[900,100],[1010,170],[140,300],[420,260],[640,320],[860,280]];
  stars.forEach(function(s, i){
    g.fillStyle = i % 3 === 0 ? "#F5C518" : "rgba(255,255,255,0.75)";
    g.beginPath(); g.arc(s[0], s[1], i % 4 === 0 ? 3 : 2, 0, Math.PI * 2); g.fill();
  });

  g.fillStyle = "#EDEAE2"; g.font = "bold 58px " + F;
  g.fillText("sleep", 72, 138);
  g.fillStyle = "#6B7280"; g.font = "28px " + F;
  g.fillText("你是怎么睡着的", 72, 190);

  g.strokeStyle = "#2A303C"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(72, 250); g.lineTo(W - 72, 250); g.stroke();

  g.fillStyle = "#F5C518"; g.font = "bold 24px " + F;
  g.fillText("你的睡眠人格 · " + t.rare, 72, 336);

  g.fillStyle = "#EDEAE2"; g.font = "bold 90px " + F;
  g.fillText(t.name, 72, 452);

  g.fillStyle = "#9BA1AD"; g.font = "29px " + F;
  var y = wrapText(g, t.one, 72, 530, W - 144, 46) + 36;

  g.font = "28px " + F;
  t.feat.slice(0, 3).forEach(function(f){
    g.fillStyle = "#F5C518";
    g.beginPath(); g.arc(84, y - 9, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#EDEAE2";
    y = wrapText(g, f, 112, y, W - 210, 44) + 20;
  });

  g.strokeStyle = "#2A303C"; g.beginPath();
  g.moveTo(72, H - 180); g.lineTo(W - 72, H - 180); g.stroke();
  g.fillStyle = "#6B7280"; g.font = "26px " + F;
  g.fillText("你也测测，看是不是同一型", 72, H - 124);
  g.fillStyle = "#F5C518"; g.font = "bold 26px " + F;
  g.fillText("[ 你的链接 ]", 72, H - 80);

  return cv.toDataURL("image/png");
}

(function(){
  var m = /(?:^|&)r=([a-z]+)/.exec((location.search || "").replace(/^\?/, ""));
  if (!m || !TYPES[m[1]]) return;
  var t = TYPES[m[1]];
  var bar = document.createElement("div");
  bar.style.cssText = "background:#15181F;border:1px solid #2A303C;padding:18px;" +
    "margin-bottom:24px;text-align:left;width:100%;animation:fadeUp .45s both";
  bar.innerHTML = '<div style="font-size:11px;color:#6B7280;letter-spacing:.18em;margin-bottom:7px">你的朋友测出来是</div>' +
    '<div style="font-size:26px;font-weight:800;color:#F5C518;margin-bottom:5px">' + t.name + '</div>' +
    '<div style="font-size:13px;color:#9BA1AD;line-height:1.7">' + t.one + '</div>' +
    '<div style="margin-top:12px;font-size:13px;color:#EDEAE2;font-weight:700">你也测一下，看是不是同一型 ↓</div>';
  document.getElementById("cover").insertBefore(bar, document.getElementById("cover").firstChild);
})();

(function(){
  var m = /(?:^|&)demo=(\d+)/.exec((location.search || "").replace(/^\?/, ""));
  if (!m) return;
  document.getElementById("cover").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("total").textContent = QS.length;
  curIdx = Math.min(+m[1], QS.length - 1);
  renderQ();
})();
</script>
