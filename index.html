<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你是怎么睡的</title>
<meta name="description" content="12 道题，3 分钟，测出你的睡眠人格。">
<style>
  :root{
    --paper:#faf8f4; --ink:#1a1a1a; --ink2:#5c5751; --ink3:#9c9690;
    --line:#e3ded6; --card:#fff; --accent:#c08a4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100dvh;overflow-x:hidden}
  .page{min-height:100dvh;max-width:520px;margin:0 auto;
    padding:0 26px env(safe-area-inset-bottom,0);display:flex;flex-direction:column}

  /* ================= 动画 ================= */
  @keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(-2deg)}}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  @keyframes fadeUpBig{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:scale(.86)}55%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes exitUp{to{opacity:0;transform:translateY(-26px) scale(.98)}}
  @keyframes enterUp{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  /* ---------- 封面 ---------- */
  #cover{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:36px 0 30px}
  #cover.leaving{animation:fadeUp .3s reverse both}

  .brand{font-size:58px;font-weight:900;letter-spacing:-.045em;line-height:1;
    margin-bottom:14px;animation:fadeUpBig .7s cubic-bezier(.2,.9,.3,1) both}
  #cover h1{font-size:21px;font-weight:700;margin:0 0 40px;letter-spacing:-.01em;
    animation:fadeUp .7s cubic-bezier(.2,.9,.3,1) .12s both}

  .art{margin:0 0 44px;animation:fadeUp .8s cubic-bezier(.2,.9,.3,1) .24s both}
  .art svg .moon{transform-origin:78px 70px;animation:float 5.5s ease-in-out infinite}
  .art svg .s1{animation:twinkle 2.6s ease-in-out infinite}
  .art svg .s2{animation:twinkle 3.4s ease-in-out .6s infinite}
  .art svg .s3{animation:twinkle 2.1s ease-in-out 1.1s infinite}
  .art svg .zzz{animation:breathe 3s ease-in-out infinite}

  #cover .btn{width:100%;max-width:300px;background:var(--ink);color:#fff;border:0;
    padding:20px;font-size:18px;font-weight:700;letter-spacing:.07em;cursor:pointer;
    font-family:inherit;border-radius:14px;animation:fadeUp .7s cubic-bezier(.2,.9,.3,1) .38s both;
    transition:transform .12s,opacity .12s}
  #cover .btn:active{transform:scale(.97);opacity:.85}
  #cover .meta{margin-top:20px;font-size:13.5px;color:var(--ink3);line-height:2;
    animation:fadeUp .7s .5s both}
  #cover .foot{margin-top:34px;font-size:12px;color:var(--ink3);line-height:1.9;
    animation:fadeUp .7s .58s both}

  /* ---------- 题目 ---------- */
  #quiz{flex:1;display:flex;flex-direction:column;padding:26px 0 30px;animation:enterUp .38s cubic-bezier(.2,.9,.3,1) both}
  .pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:var(--ink);
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  .cnt{margin-top:14px;font-size:13px;color:var(--ink3);letter-spacing:.14em;text-align:center}

  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0 20px}
  .qwrap.enter{animation:enterUp .34s cubic-bezier(.2,.9,.3,1) both}
  .qwrap.exit{animation:exitUp .2s ease both}

  .qnum{font-size:12.5px;color:var(--accent);letter-spacing:.2em;margin-bottom:14px}
  .qtext{font-size:28px;line-height:1.52;font-weight:800;letter-spacing:-.014em;margin:0 0 36px}
  .opts{display:flex;flex-direction:column;gap:13px}
  .opt{width:100%;text-align:left;background:var(--card);color:var(--ink);
    border:1.5px solid var(--line);border-radius:15px;padding:20px 20px;min-height:64px;
    font:20px/1.55 inherit;cursor:pointer;display:flex;align-items:center;gap:13px;
    transition:background .2s,border-color .2s,transform .12s;
    animation:fadeUp .38s cubic-bezier(.2,.9,.3,1) both}
  .opt::before{content:"";flex:0 0 auto;width:11px;height:11px;border-radius:50%;
    background:#d8d2c8;transition:background .2s ease}
  .opt:active{transform:scale(.985)}
  .opt.sel{border-color:var(--accent);background:#fdf7ee}
  .opt.sel::before{background:var(--accent)}
  .opt:nth-child(1){animation-delay:.04s}
  .opt:nth-child(2){animation-delay:.10s}
  .opt:nth-child(3){animation-delay:.16s}
  .opt:nth-child(4){animation-delay:.22s}
  .opt:active{transform:scale(.985)}
  

  /* ---------- 结果 ---------- */
  #result{flex:1;padding:30px 0 40px;animation:enterUp .42s cubic-bezier(.2,.9,.3,1) both}
  .rTop{text-align:center;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .rKick{font-size:12px;color:var(--accent);letter-spacing:.2em;margin-bottom:14px;
    animation:fadeUp .5s both}
  .rName{font-size:44px;font-weight:900;letter-spacing:-.035em;line-height:1.12;
    margin:0 0 16px;animation:popIn .62s cubic-bezier(.2,.9,.3,1) .06s both}
  .rOne{font-size:16px;color:var(--ink2);line-height:1.8;margin:0;animation:fadeUp .5s .18s both}

  .shareBar{width:100%;background:var(--ink);color:#fff;border:0;border-radius:2px;
    padding:18px;font-size:17px;font-weight:700;letter-spacing:.03em;cursor:pointer;
    font-family:inherit;margin:24px 0 28px;border-radius:14px;animation:fadeUp .5s .26s both;
    transition:transform .12s,opacity .12s}
  .shareBar:active{transform:scale(.975);opacity:.85}

  .feat{list-style:none;padding:0;margin:0 0 24px}
  .feat li{position:relative;padding:15px 0 15px 26px;border-bottom:1px solid var(--line);
    font-size:16px;line-height:1.75;animation:fadeUp .5s both}
  .feat li:nth-child(1){animation-delay:.32s}
  .feat li:nth-child(2){animation-delay:.38s}
  .feat li:nth-child(3){animation-delay:.44s}
  .feat li:last-child{border-bottom:0}
  .feat li:before{content:"";position:absolute;left:4px;top:24px;width:7px;height:7px;
    border-radius:50%;background:var(--accent)}

  .sec{margin-bottom:24px;animation:fadeUp .5s .5s both}
  .sec h4{margin:0 0 9px;font-size:12.5px;color:var(--accent);letter-spacing:.16em;font-weight:700}
  .sec p{margin:0;font-size:16px;line-height:1.8;color:var(--ink2)}

  .lock{border:1.5px dashed var(--line);border-radius:3px;padding:26px 20px;margin:28px 0;
    text-align:center;animation:fadeUp .5s .5s both}
  .lock b{display:block;font-size:18px;margin-bottom:8px}
  .lock p{margin:0 0 20px;font-size:14px;color:var(--ink3);line-height:1.7}
  .unlockBtn{width:100%;background:var(--ink);color:#fff;border:0;border-radius:2px;
    padding:18px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;
    display:block;text-decoration:none;border-radius:14px;transition:transform .12s}
  .unlockBtn:active{transform:scale(.975)}

  .subs{display:flex;gap:10px;margin-top:12px;animation:fadeUp .5s .58s both}
  .ghost{flex:1;background:transparent;color:var(--ink2);border:1.5px solid var(--line);
    border-radius:2px;padding:15px;font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit;border-radius:12px;transition:background .15s}
  .ghost:active{background:#f0ece4}

  footer{color:var(--ink3);font-size:12px;text-align:center;padding:28px 0 18px;line-height:1.9}

  .hidden{display:none!important}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="page">

  <section id="cover">
    <div class="brand">sleep</div>
    <h1>测测你是怎么睡的</h1>

    <div class="art">
      <svg width="160" height="160" viewBox="0 0 160 160" fill="none">
        <g class="moon">
          <circle cx="80" cy="78" r="46" fill="#1a1a1a"/>
          <circle cx="100" cy="62" r="38" fill="#faf8f4"/>
        </g>
        <circle class="s1" cx="32" cy="34" r="3.2" fill="#1a1a1a"/>
        <circle class="s2" cx="128" cy="40" r="2.4" fill="#c08a4a"/>
        <circle class="s3" cx="24" cy="104" r="2" fill="#1a1a1a"/>
        <g class="zzz" fill="#c08a4a">
          <text x="112" y="34" font-size="15" font-weight="800" font-family="sans-serif">z</text>
          <text x="124" y="22" font-size="11" font-weight="800" font-family="sans-serif">z</text>
        </g>

  <section id="quiz" class="hidden">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="cnt"><span id="cur">1</span> / <span id="total">12</span></div>
    <div class="qwrap" id="qwrap"></div>
  </section>

  <section id="result" class="hidden"></section>

</div>
<canvas id="cv" width="1080" height="1560" class="hidden"></canvas>

<script>
"use strict";

var PAY_URL = "";

var TYPES = {
  instant: {
    name: "秒睡型", rare: "被所有人羡慕的那种",
    one: "沾到枕头就着，别人数羊数到三百的时候，你已经做完一个梦了。",
    feat: ["躺下到睡着，一般不超过五分钟", "在车上、沙发上、甚至站着都能睡着", "别人问你怎么睡着的，你说「就闭上眼啊」"],
    do: "你的睡眠天赋很值钱。把睡觉时间固定下来，你基本不会有睡眠问题。",
    avoid: "别因为「能睡着」就一直熬夜。能睡着不等于睡够了，长期欠债照样垮。"
  },
  rehearsal: {
    name: "复盘型", rare: "脑子关不掉的那类",
    one: "一躺下，白天说错的话、明天要做的事，全来了。",
    feat: ["躺下之后开始回放今天的每一句对话", "想到明天的事，会顺便把一周的都想了", "越想睡越清醒，越清醒越焦虑"],
    do: "睡前一小时把明天要做的事写在纸上。写下来的事，脑子才肯放下。",
    avoid: "别在床上想事情。床只用来睡，想事去桌子前坐着想。"
  },
  phone: {
    name: "手机陪睡型", rare: "知道不对但改不掉",
    one: "不看手机睡不着，看完更睡不着。",
    feat: ["躺下第一件事是摸手机", "说好只看五分钟，抬头已经一点半", "手机不在枕头边会不安"],
    do: "把充电线挪到够不着的地方。不用靠意志力，靠距离。",
    avoid: "别在床上刷短视频。那个东西是按「让你停不下来」设计的，你赢不了。"
  },
  sound: {
    name: "声响依赖型", rare: "绝对安静反而睡不着",
    one: "必须有点声音才睡得着，安静会让你更清醒。",
    feat: ["睡觉要开风扇、白噪音或者播客", "完全安静的环境会让你胡思乱想", "出门住酒店，第一晚基本睡不着"],
    do: "给自己准备固定的声音：同一个播客、同一段白噪音。重复的声音会成为入睡信号。",
    avoid: "别听有情节的东西。剧情会让你想「再听一点」，白噪音不会。"
  },
  light: {
    name: "浅眠型", rare: "睡着比谁都难，醒得比谁都快",
    one: "一点动静就醒，醒了就很难再睡着。",
    feat: ["楼上拖椅子你能醒", "别人翻身你也会醒", "睡了一整晚，早上还是像没睡"],
    do: "耳塞 + 遮光眼罩，这两个东西对你的效果比任何保健品都好。",
    avoid: "别在睡前喝酒。酒精让你更快睡着，但会让你后半夜一直醒。"
  },
  early: {
    name: "早鸟型", rare: "闹钟还没响就睁眼",
    one: "不管几点睡，早上都会在同一个时间醒，而且醒得很彻底。",
    feat: ["闹钟一般用不上，你会早几分钟醒", "周末也睡不了懒觉，七点就睁眼", "早上的两个小时是你效率最高的时间"],
    do: "把最重要的事放在早上。你的上午值别人一整天。",
    avoid: "别因为「早醒」就觉得自己睡不够。醒得早不等于睡得好，看总时长。"
  },
  snooze: {
    name: "赖床型", rare: "和闹钟搏斗的每一天",
    one: "闹钟响第一遍的时候，你已经算好了还能睡几分钟。",
    feat: ["闹钟设了五个，间隔五分钟", "每天都在「再睡五分钟」和「要迟到了」之间挣扎", "起床后的半小时是行尸走肉"],
    do: "把闹钟放远一点，必须下床才能关。身体动起来，脑子才醒。",
    avoid: "别按贪睡键。那五分钟的睡眠质量极差，只会让你更困。"
  },
  weekend: {
    name: "周末补觉型", rare: "平时欠的债，周末一起还",
    one: "工作日睡五六个小时，周末睡到下午，然后把作息彻底搞乱。",
    feat: ["周一到周五靠意志力撑着", "周六睡到下午两点，起来天都黑了", "周日晚上睡不着，周一早上起不来"],
    do: "周末最多比平时多睡两小时。补太多，你的生物钟会更乱。",
    avoid: "别指望周末补回来。睡眠债补不回来，只能少欠一点。"
  }
};

var QS = [
  { q: "躺下之后，你一般多久能睡着？",
    o: [["五分钟以内，沾枕头就着", {instant:3}], ["半小时以上，脑子停不下来", {rehearsal:3}], ["看手机看到困为止", {phone:3}], ["不知道，反正经常天亮了还在躺", {early:3}]] },

  { q: "睡前你最后做的一件事是？",
    o: [["刷手机，说好五分钟", {phone:3}], ["开个播客或者白噪音", {sound:3}], ["躺着想明天要做什么", {rehearsal:3}], ["设好闹钟，然后倒头就睡", {snooze:3}]] },

  { q: "早上闹钟响的时候，你？",
    o: [["经常在闹钟响之前就醒了", {early:3}], ["按掉，再睡五分钟，再按掉", {snooze:3}], ["周末直接睡到下午", {weekend:3}], ["一响就起来，没什么挣扎", {instant:3}]] },

  { q: "你一般怎么睡？",
    o: [["侧躺，抱着东西", {light:3}], ["开着风扇或者电视才能睡", {sound:3}], ["几点睡全看第二天要不要早起", {weekend:3}], ["随便什么姿势，闭眼就着", {instant:3}]] },

  { q: "半夜醒了，你会？",
    o: [["翻个身继续睡，很快", {light:3}], ["看一眼手机，然后就睡不着了", {phone:3}], ["开始想事情，越想越清醒", {rehearsal:3}], ["几乎不会半夜醒", {instant:3}]] },

  { q: "周末你一般几点起？",
    o: [["跟平时差不多，睡不了懒觉", {early:3}], ["睡到中午，甚至下午", {weekend:3}], ["闹钟响了十遍才起", {snooze:3}], ["醒了但不起来，躺着刷手机", {phone:3}]] },

  { q: "你的睡眠环境必须是？",
    o: [["有点声音，绝对安静我睡不着", {sound:3}], ["必须全黑、必须安静", {light:3}], ["无所谓，什么环境都能睡", {instant:3}], ["必须是自己的床，换地方睡不着", {snooze:3}]] },

  { q: "你做梦多吗？",
    o: [["经常做，而且记得很清楚", {rehearsal:3}], ["偶尔，都是些乱七八糟的", {light:3}], ["很少，睡过去就什么都不知道", {instant:3}], ["一累就做梦，不累就不做", {weekend:3}]] },

  { q: "有人在你旁边睡，你会？",
    o: [["睡不着，动一下我就醒", {light:3}], ["得等他先睡着我才行", {sound:3}], ["没影响，我照样秒睡", {instant:3}], ["得背对着，各睡各的", {phone:3}]] },

  { q: "早上醒来第一件事是？",
    o: [["摸手机看时间，然后开始刷", {phone:3}], ["看时间，发现比闹钟早", {early:3}], ["再睡五分钟", {snooze:3}], ["想今天能不能不上班", {weekend:3}]] },

  { q: "你一般睡几个小时？",
    o: [["工作日五六个，周末十个小时", {weekend:3}], ["固定七小时，很规律", {early:3}], ["睡够八小时也还是累", {light:3}], ["看情况，有时候四小时也精神", {rehearsal:3}]] },

  { q: "别人说你睡觉的时候？",
    o: [["「你怎么做到的，一沾枕头就没声了」", {instant:3}], ["「你半夜还在刷手机吧」", {phone:3}], ["「叫都叫不醒」", {snooze:3}], ["「你睡觉是不是开了一晚上电视」", {sound:3}]] }
];

var answers = new Array(QS.length).fill(-1);
var curIdx = 0;

(function(){
  try{
    var n = parseInt(localStorage.getItem("sleep_cnt") || "0", 10) + 1;
    localStorage.setItem("sleep_cnt", n);
    document.getElementById("cnt").textContent = "已测试人数：" + (1042 + n);
  }catch(e){}
})();

document.getElementById("start").addEventListener("click", function(){
  var cv = document.getElementById("cover");
  cv.style.transition = "opacity .26s, transform .26s";
  cv.style.opacity = "0";
  cv.style.transform = "translateY(-16px)";
  setTimeout(function(){
    cv.classList.add("hidden");
    var q = document.getElementById("quiz");
    q.classList.remove("hidden");
    document.getElementById("total").textContent = QS.length;
    curIdx = 0;
    renderQ();
  }, 220);
});

function renderQ(){
  var q = QS[curIdx];
  document.getElementById("cur").textContent = curIdx + 1;
  document.getElementById("pbar").style.width = (curIdx / QS.length * 100) + "%";

  var h = '<div class="qnum">第 ' + (curIdx + 1) + ' 题</div>';
  h += '<div class="qtext">' + q.q + '</div><div class="opts">';
  q.o.forEach(function(o, i){
    h += '<button class="opt" data-i="' + i + '">' + o[0] + '</button>';
  });
  h += '</div>';

  var w = document.getElementById("qwrap");
  w.className = "qwrap";
  w.innerHTML = h;
  void w.offsetWidth;
  w.classList.add("enter");

  w.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.dataset.lock) return;
      w.querySelectorAll(".opt").forEach(function(x){ x.dataset.lock = "1"; });
      b.classList.add("sel");
      answers[curIdx] = +b.dataset.i;
      setTimeout(function(){
        w.classList.remove("enter");
        w.classList.add("exit");
        setTimeout(function(){
          curIdx++;
          if (curIdx >= QS.length) showResult();
          else renderQ();
        }, 210);
      }, 300);
    });
  });
}

function calc(){
  var score = {};
  Object.keys(TYPES).forEach(function(k){ score[k] = 0; });
  answers.forEach(function(oi, qi){
    if (oi < 0) return;
    var m = QS[qi].o[oi][1];
    Object.keys(m).forEach(function(k){ score[k] += m[k]; });
  });
  var best = null, bv = -1;
  Object.keys(score).forEach(function(k){ if (score[k] > bv){ bv = score[k]; best = k; } });
  var sec = null, sv = -1;
  Object.keys(score).forEach(function(k){ if (k !== best && score[k] > sv){ sv = score[k]; sec = k; } });
  return { main: best, second: sec, score: score };
}

function wrapText(g, text, x, y, maxW, lh){
  var line = "";
  for (var i = 0; i < text.length; i++){
    var t = line + text[i];
    if (g.measureText(t).width > maxW && line){ g.fillText(line, x, y); line = text[i]; y += lh; }
    else line = t;
  }
  if (line) g.fillText(line, x, y);
  return y + lh;
}

function drawCard(r){
  var t = TYPES[r.main];
  var cv = document.getElementById("cv");
  var W = 1080, H = 1560;
  cv.width = W; cv.height = H;
  var g = cv.getContext("2d");
  var F = "-apple-system,'PingFang SC','Microsoft YaHei',sans-serif";

  g.fillStyle = "#faf8f4"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#1a1a1a"; g.font = "bold 62px " + F;
  g.fillText("sleep", 72, 142);
  g.fillStyle = "#5c5751"; g.font = "30px " + F;
  g.fillText("测测你是怎么睡的", 72, 196);

  g.strokeStyle = "#e3ded6"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(72, 258); g.lineTo(W - 72, 258); g.stroke();

  g.fillStyle = "#c08a4a"; g.font = "bold 25px " + F;
  g.fillText("你的睡眠人格 · " + t.rare, 72, 346);

  g.fillStyle = "#1a1a1a"; g.font = "bold 94px " + F;
  g.fillText(t.name, 72, 466);

  g.fillStyle = "#5c5751"; g.font = "30px " + F;
  var y = wrapText(g, t.one, 72, 546, W - 144, 47) + 38;

  g.font = "28px " + F;
  t.feat.slice(0, 3).forEach(function(f){
    g.fillStyle = "#c08a4a";
    g.beginPath(); g.arc(84, y - 9, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1a1a1a";
    y = wrapText(g, f, 112, y, W - 210, 45) + 20;
  });

  g.strokeStyle = "#e3ded6"; g.beginPath();
  g.moveTo(72, H - 186); g.lineTo(W - 72, H - 186); g.stroke();
  g.fillStyle = "#9c9690"; g.font = "27px " + F;
  g.fillText("你也测测，看是不是同一型", 72, H - 128);
  g.fillStyle = "#1a1a1a"; g.font = "bold 27px " + F;
  g.fillText("[ 你的链接 ]", 72, H - 82);

  return cv.toDataURL("image/png");
}
