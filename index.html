/* ============ 12 道题 ============ */
var QS = [
  { q: "躺下之后，你一般多久能睡着？",

    o: [["刷手机，说好五分钟", {phone:3}], ["开个播客或者白噪音", {sound:3}], ["躺着想明天要做什么", {rehearsal:3}], ["设好闹钟，然后倒头就睡", {snooze:3}]] },

  { q: "早上闹钟响的时候，你？",

  { q: "周末你一般几点起？",

  { q: "你的睡眠环境必须是？",

/* ============ 逻辑 ============ */
var answers = new Array(QS.length).fill(-1);

function renderQuiz(){
  var h = "";
  QS.forEach(function(item, i){
    h += '<div class="q" id="q' + i + '"><div class="qn">第 ' + (i+1) + ' / ' + QS.length + ' 题</div>';
    h += '<div class="qt">' + item.q + '</div>';
    item.o.forEach(function(o, j){
      h += '<button class="opt' + (answers[i] === j ? " sel" : "") + '" data-q="' + i + '" data-o="' + j + '">' + o[0] + '</button>';
    });
    h += '</div>';
  });
  document.getElementById("quiz").innerHTML = h;
  document.querySelectorAll(".opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      var qi = +btn.dataset.q, oi = +btn.dataset.o;
      answers[qi] = oi;
      document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(function(b){ b.classList.remove("sel"); });
      btn.classList.add("sel");
      updateProgress();
    });
  });
  updateProgress();
}

function updateProgress(){
  var done = answers.filter(function(a){ return a >= 0; }).length;
  document.getElementById("prog").style.width = (done / QS.length * 100) + "%";
  document.getElementById("submit").disabled = done < QS.length;
  document.getElementById("submit").textContent = done < QS.length
    ? ("还有 " + (QS.length - done) + " 题")
    : "看我的结果";
}

function calc(){
  var score = {};
  Object.keys(TYPES).forEach(function(k){ score[k] = 0; });
  answers.forEach(function(oi, qi){
    var m = QS[qi].o[oi][1];
    Object.keys(m).forEach(function(k){ score[k] += m[k]; });
  });
  var best = null, bestV = -1;
  Object.keys(score).forEach(function(k){
    if (score[k] > bestV){ bestV = score[k]; best = k; }
  });
  // 第二型
  var second = null, sV = -1;
  Object.keys(score).forEach(function(k){
    if (k !== best && score[k] > sV){ sV = score[k]; second = k; }
  });
  return { main: best, second: second, score: score };
}

      h += '<p>包含：另外 2 条特征 · 适合做什么 · 要避开的坑 · 你的第二型</p>';
      h += '<a id="paylink" href="' + PAY_URL + '" target="_blank" rel="noopener" style="display:block;text-align:center;background:linear-gradient(135deg,#f0b429,#e0930f);color:#241a05;border-radius:11px;padding:15px;font-size:16px;font-weight:800;text-decoration:none">立即解锁 ¥9.9</a>';
      h += '<div style="font-size:12px;color:#5f6b7d;text-align:center;margin-top:10px">付款后自动收到完整版链接，全程无需等待</div>';
    } else {
      h += '<h3>完整报告暂未开放</h3>';
      h += '<p>作者还没接上支付。你可以先截图保存免费部分。</p>';
    }
    h += '</div>';
  }

  return h;
}

/* ============ 生成结果图 ============ */
function drawCard(r){
  var t = TYPES[r.main];
  var cv = document.getElementById("cv");
  var W = 1080, H = 1560;
  cv.width = W; cv.height = H;
  var g = cv.getContext("2d");

  // 背景
  var grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, "#1b2433");
  grd.addColorStop(1, "#0d1015");
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);

  // 顶部细线
  g.fillStyle = "#4c8dff";
  g.fillRect(72, 96, 96, 4);

  g.fillStyle = "#9aa3b2";
  g.font = "28px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("12 题测出你适合靠什么赚钱", 72, 168);

  g.fillStyle = "#f0b429";
  g.font = "bold 26px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("你的结果 · " + t.rare, 72, 268);

  g.fillStyle = "#ffffff";
  g.font = "bold 82px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText(t.name, 72, 372);

  g.fillStyle = "#b6c0d0";
  g.font = "32px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  wrapText(g, t.one, 72, 440, W - 144, 48);

  // 三条特征
  var y = 580;
  g.fillStyle = "#cdd4e0";
  g.font = "30px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  t.feat.forEach(function(f){
    g.fillStyle = "#4c8dff";
    g.fillText("—", 72, y);
    g.fillStyle = "#cdd4e0";
    y = wrapText(g, f, 118, y, W - 200, 44) + 22;
  });

  // 适合做什么
  y += 30;
  g.fillStyle = "#f0b429";
  g.font = "bold 26px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("适合做什么", 72, y);
  y += 46;
  g.fillStyle = "#cdd4e0";
  g.font = "28px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  y = wrapText(g, t.do, 72, y, W - 144, 42) + 26;

  // 底部
  g.fillStyle = "#2a3342";
  g.fillRect(72, H - 210, W - 144, 2);
  g.fillStyle = "#8d97a8";
  g.font = "26px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("你呢？搜「12 题测出你适合靠什么赚钱」", 72, H - 150);
  g.fillStyle = "#4c8dff";
  g.font = "bold 26px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  g.fillText("[ 你的链接放在这里 ]", 72, H - 100);

  return cv.toDataURL("image/png");
}

function wrapText(g, text, x, y, maxW, lh){
  var line = "";
  for (var i = 0; i < text.length; i++){
    var test = line + text[i];
    if (g.measureText(test).width > maxW && line){
      g.fillText(line, x, y);
      line = text[i];
      y += lh;
    } else {
      line = test;
    }
  }
  if (line) g.fillText(line, x, y);
  return y + lh;
}
